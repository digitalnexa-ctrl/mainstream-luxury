<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MAINSTREAM — Admin Control</title>
<link rel="stylesheet" href="dashboard.css">
</head>
<body>
<div class="layout">
<aside id="sidebar">
  <div class="logo"><b>M</b><span>MAINSTREAM<small>ADMIN CONTROL</small></span></div>
  <nav>
    <button class="nav active" data-page="overview">Overview</button>
    <button class="nav" data-page="products">Products</button>
    <button class="nav" data-page="orders">Orders</button>
    <button class="nav" data-page="customers">Customers</button>
    <button class="nav" data-page="reviews">Reviews</button>
    <button class="nav" data-page="homepage">Homepage</button>
    <button class="nav" data-page="settings">Settings</button>
  </nav>
  <a href="index.html" target="_blank" class="store">VIEW STORE ↗</a>
</aside>

<main>
<header>
  <button id="menu" type="button">☰</button>
  <div><small>MAINSTREAM / CONTROL CENTER</small><h1 id="title">Overview</h1></div>
  <div class="online"><i></i> Store Online</div>
</header>
<section id="app"></section>
</main>
</div>

<div class="modal" id="productModal">
<div class="modal-box">
<button class="close" type="button" onclick="closeProduct()">×</button>
<h2 id="modalTitle">Add Product</h2>
<form id="productForm">
<input type="hidden" id="editId">
<label>Product name<input id="name" required></label>

<div class="row">
<label>Price<input id="price" type="number" min="0" required></label>
<label>Old price<input id="oldPrice" type="number" min="0"></label>
</div>

<div class="row">
<label>Category<select id="category">
<option>Printed T-Shirts</option>
<option>Oversized T-Shirts</option>
<option>Hoodies</option>
</select></label>
<label>Stock<input id="stock" type="number" min="0" value="0"></label>
</div>

<label>Description<textarea id="description" rows="3" placeholder="Product description"></textarea></label>
<label>Front image URL<input id="front" type="url" placeholder="https://..."></label>
<label>Back image URL<input id="back" type="url" placeholder="https://..."></label>
<label>Gallery image URLs <small>(comma separated)</small><input id="gallery" placeholder="https://..., https://..."></label>
<label>Colors <small>(comma separated)</small><input id="colors" placeholder="Black, White"></label>
<label>Sizes<input id="sizes" value="S, M, L, XL"></label>
<label class="check"><input id="newDrop" type="checkbox"> New Drop</label>
<button class="save" type="submit">SAVE PRODUCT</button>
</form>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
